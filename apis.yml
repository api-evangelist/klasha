aid: klasha
name: Klasha
description: 'Klasha is a cross-border payments company for emerging markets that lets
  international businesses sell into Africa and accept payments online in local African
  currencies. The Klasha platform covers payment collection (cards, bank transfer, USSD,
  M-Pesa and mobile money, Klasha wallet), payouts to bank accounts and mobile money
  wallets across Africa and to China, currency swap between merchant wallets at internal
  Klasha rates, virtual account creation for bank-account collection, payment links,
  and an embeddable JavaScript checkout. Developers integrate through the documented
  REST APIs at developers.klasha.com, the Klasha Inline JavaScript library, first-party
  web and mobile SDKs (Angular, React, Vue 2/3, iOS, Android, Flutter, Ionic, React
  Native), or ready-made e-commerce plugins for WooCommerce, Magento 2, BigCommerce,
  OpenCart, Ecwid, Wix and Weebly.'
