apis:
- aid: klasha:payments-api
  name: Klasha Payments API
  description: Collect payments from customers in Africa via card, bank transfer, USSD,
    M-Pesa, mobile money and the Klasha wallet, including charge validation, refunds
    and exchange rates.
  humanURL: https://developers.klasha.com/accepting-payments/payments-api
  baseURL: https://gate.klasapps.com
  tags:
  - Payments
  - Cards
  - Mobile Money
  - Refunds
  properties:
  - type: Documentation
    url: https://developers.klasha.com/accepting-payments/payments-api
  - type: Authentication
    url: authentication/klasha-authentication.yml
  - type: Sandbox
    url: sandbox/klasha-sandbox.yml
- aid: klasha:payout-api
  name: Klasha Payout API
  description: Send money locally to bank accounts and mobile money wallets across
    Africa and to China, with bank-code lookup, account resolution, wallet balances
    and Triple-DES encrypted transfer payloads.
  humanURL: https://developers.klasha.com/transfers/payout
  baseURL: https://gate.klasapps.com
  tags:
  - Payouts
  - Transfers
  - Mobile Money
  properties:
  - type: Documentation
    url: https://developers.klasha.com/transfers/payout
- aid: klasha:swap-api
  name: Klasha Swap API
  description: Generate a quote and swap funds between merchant wallets using internal
    Klasha foreign-exchange rates, then fetch the resulting swap by reference or quote
    token.
  humanURL: https://developers.klasha.com/transfers/swap-api
  baseURL: https://gate.klasapps.com
  tags:
  - Foreign Exchange
  - Wallets
  properties:
  - type: Documentation
    url: https://developers.klasha.com/transfers/swap-api
- aid: klasha:virtual-accounts-api
  name: Klasha Virtual Account API
  description: Create virtual accounts on demand in NGN and GHS, receive customer funds
    through them, requery accounts, poll collection status and pull balances and statements.
  humanURL: https://developers.klasha.com/bank-account-collection/virtual-account-creation
  baseURL: https://gate.klasapps.com
  tags:
  - Virtual Accounts
  - Collection
  tags_raw:
  - Virtual Accounts
  - Collections
  properties:
  - type: Documentation
    url: https://developers.klasha.com/bank-account-collection/virtual-account-creation
- aid: klasha:payment-link-api
  name: Klasha Payment Link API
  description: Generate payment links for merchants and sub-merchants to collect payments
    without a code integration, from the dashboard or over the API.
  humanURL: https://developers.klasha.com/accepting-payments/payment-link/payment-link-api
  baseURL: https://gate.klasapps.com
  tags:
  - Payment Links
  - Checkout
  properties:
  - type: Documentation
    url: https://developers.klasha.com/accepting-payments/payment-link/payment-link-api
