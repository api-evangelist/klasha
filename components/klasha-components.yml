families:
- name: Klasha Inline
  kind: hosted checkout popup
  description: >-
    A drop-in JavaScript checkout embedded by adding a script tag to the page head and
    invoking a client object. Renders a Klasha-hosted payment pop-up and returns the
    outcome to a caller-supplied callback.
  loader: https://js.klasha.com/pay.js
  embed: '<script type="text/javascript" src="https://js.klasha.com/pay.js"></script>'
  entrypoint: KlashaClient
  init_signature:
  - merchantKey
  - businessId
  - amount
  - description
  - callback
  - currency
  - destinationCurrency
  - paymentKit
  - environment
  payment_kit_fields:
  - tx_ref
  - fullname
  - firstName
  - lastName
  - email
  - phone_number
  - businessId
  - merchantKey
  - amount
  - sourceAmount
  - rate
  callback_payload: {amount: number, currency: string, status: string, tnxRef: string}
  environment_flag: 'true for dev, false for production'
  docs: https://developers.klasha.com/accepting-payments/klasha-inline
- name: HTML Checkout
  kind: markup-only checkout
  description: >-
    Collect payments using Klasha Inline directly from an HTML file with no framework.
  docs: https://developers.klasha.com/accepting-payments/html-checkout
- name: Payment Links
  kind: hosted payment page
  description: >-
